[project]
name = "sprawl"
version = "0.1.0"
description = "Secrets-sprawl detector: find leaked credentials in GCP and rank them by exposure and blast radius"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27", "google-auth>=2.30", "requests>=2.31", "google-genai>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "ruff"]
openai = ["openai>=1.50"]  # test/eval-only provider; never installed in the deployed image

[project.scripts]
sprawl = "sprawl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sprawl"]

[tool.setuptools.package-data]
sprawl = ["*.html", "samples/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
testpaths = ["tests"]
markers = [
  "live_vertex: calls Gemini on Vertex AI; opt-in via SPRAWL_LIVE_VERTEX=1",
  "live_openai: calls OpenAI; opt-in via SPRAWL_LIVE_OPENAI=1",
  "live_gcp: reaches a deployed firewall; opt-in via SPRAWL_LIVE_URL=<url>",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
